apiVersion: v1
kind: ConfigMap
metadata:
  name: taskmanager-config
  labels:
    app: taskmanager
data:
  DB_HOST: "taskmanager-db"
  DB_PORT: "5432"
  DB_NAME: {{ .Values.database.name | quote }}
  DB_USER: {{ .Values.database.user | quote }}
  NODE_ENV: "production"
  PORT: {{ .Values.backend.port | toString | quote }}