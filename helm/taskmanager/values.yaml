# ── Global ──────────────────────────────────────────────────
global:
  imageRegistry: ""        # e.g. your ECR URL in Phase 3

# ── Frontend ────────────────────────────────────────────────
frontend:
  image:
    repository: 751530150420.dkr.ecr.us-east-1.amazonaws.com/k8s-frontend
    tag: "5f0e7c40e03b07fe9387b9093904ffb8661517cc"
    pullPolicy: Always
  replicaCount: 2
  port: 80
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  hpa:
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

backend:
  image:
    repository: 751530150420.dkr.ecr.us-east-1.amazonaws.com/k8s-backend
    tag: "5f0e7c40e03b07fe9387b9093904ffb8661517cc"
    pullPolicy: Always
  replicaCount: 2
  port: 5000
  service:
    type: ClusterIP
    port: 5000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  hpa:
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70

database:
  image:
    repository: 751530150420.dkr.ecr.us-east-1.amazonaws.com/k8s-db
    tag: "5f0e7c40e03b07fe9387b9093904ffb8661517cc"
    pullPolicy: Always
  port: 5432
  name: taskdb
  user: postgres
  storage: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

ingress:
  enabled: true
  

secrets:
  dbPassword: "devpassword123"