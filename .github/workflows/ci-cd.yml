name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com

jobs:

  # ─── Job 1: Security scan source code ───────────────────────
  trivy-scan-code:
    name: Trivy - Scan Source Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy on filesystem
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          format: table
          exit-code: 0
          ignore-unfixed: true

  # ─── Job 2: Build and push frontend ─────────────────────────
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: trivy-scan-code
    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: meta
        run: echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build frontend image
        run: |
          docker build \
            --build-arg VITE_API_URL=${{ secrets.API_URL }} \
            -t $ECR_REGISTRY/k8s-frontend:${{ github.sha }} \
            -t $ECR_REGISTRY/k8s-frontend:latest \
            ./frontend

      - name: Trivy scan frontend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/k8s-frontend:${{ github.sha }}
          severity: CRITICAL
          format: table
          exit-code: 0
          ignore-unfixed: true

      - name: Push frontend to ECR
        run: |
          docker push $ECR_REGISTRY/k8s-frontend:${{ github.sha }}
          docker push $ECR_REGISTRY/k8s-frontend:latest

  # ─── Job 3: Build and push backend ──────────────────────────
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    needs: trivy-scan-code
    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: meta
        run: echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build backend image
        run: |
          docker build \
            -t $ECR_REGISTRY/k8s-backend:${{ github.sha }} \
            -t $ECR_REGISTRY/k8s-backend:latest \
            ./backend

      - name: Trivy scan backend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/k8s-backend:${{ github.sha }}
          severity: CRITICAL
          format: table
          exit-code: 0
          ignore-unfixed: true

      - name: Push backend to ECR
        run: |
          docker push $ECR_REGISTRY/k8s-backend:${{ github.sha }}
          docker push $ECR_REGISTRY/k8s-backend:latest

  # ─── Job 4: Update Helm values ──────────────────────────────
  update-helm:
    name: Update Helm Values
    runs-on: ubuntu-latest
    needs: [build-frontend, build-backend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update image tags in values.yaml
        run: |
          sed -i "s|tag: .*|tag: \"${{ github.sha }}\"|g" helm/taskmanager/values.yaml

      - name: Commit and push updated values.yaml
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add helm/taskmanager/values.yaml
          git commit -m "ci: update image tags to ${{ github.sha }}" || echo "No changes"
          git push